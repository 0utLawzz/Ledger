kind = "web"
previewPath = "/"
title = "Law Firm Ledger"
version = "1.0.0"
id = "artifacts/law-ledger"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24412

[services.development]
run = "pnpm --filter @workspace/law-ledger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/law-ledger", "run", "build" ]
publicDir = "artifacts/law-ledger/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24412"
BASE_PATH = "/"
